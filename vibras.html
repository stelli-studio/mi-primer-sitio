<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vibras</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="pagina-playlist">

<header class="encabezado">
    <button class="boton-menu" onclick="history.back()">←</button>
    <a class="logo" href="index.html"> ♪ STELLI<span>MUSIC</span></a>
    <a href="index.html" class="volver-inicio">Inicio</a>
</header>

<main class="contenido-playlist">

<section class="portada-playlist relajarse-portada">
    <img src="vibras.jpg" alt="Portada Para relajarse">

    <div class="datos-playlist">
        <p class="tipo-playlist">PERSONAL</p>
        <h1>✨ Buenas vibras</h1>
        <p class="descripcion-playlist">
            Canciones que disfruto escuchar para alegrar mi día.
        </p>
    </div>
</section>

<section class="seccion-canciones">

    <div class="encabezado-canciones">
        <h2>Mi música favorita</h2>
    </div>

    <div class="fila-cancion">
        <span class="numero">01</span>
        <img src="limit.jpg" alt="Los del Limit">

        <div class="info-cancion">
            <h3>Amor Fugaz</h3>
            <p>Los del Limit</p>
        </div>

        <audio class="musica">
            <source src="canciones/amor fugaz.mp3" type="audio/mpeg">
        </audio>
        <button class="boton-play" onclick="playMusic(this)">▶</button>
        <span class="duracion">♫</span>
    </div>

    <div class="fila-cancion">
        <span class="numero">02</span>
        <img src="aitana.jpg" alt="Superestrella">

        <div class="info-cancion">
            <h3>Superestrella</h3>
            <p>Aitana</p>
        </div>

        <audio class="musica">
            <source src="canciones/superestrella.mp3" type="audio/mpeg">
        </audio>
        <button class="boton-play" onclick="playMusic(this)">▶</button>
        <span class="duracion">♫</span>
    </div>

    <div class="fila-cancion">
        <span class="numero">03</span>
        <img src="paulo.jpg" alt="No Puedo">

        <div class="info-cancion">
            <h3>No Puedo</h3>
            <p>Paulo Londra</p>
        </div>

        <audio class="musica">
            <source src="canciones/no puedo.mp3" type="audio/mpeg">
        </audio>
        <button class="boton-play" onclick="playMusic(this)">▶</button>
        <span class="duracion">♫</span>
    </div>

</section>
</main>

<script>
function playMusic(boton) {
    let audio = boton.previousElementSibling;

    document.querySelectorAll(".musica").forEach(a => {
        if (a !== audio) {
            a.pause();
            a.currentTime = 0;
            a.nextElementSibling.textContent = "▶";
        }
    });

    if (audio.paused) {
        audio.play();
        boton.textContent = "⏸";
    } else {
        audio.pause();
        boton.textContent = "▶";
    }
}
</script>

</body>
</html>
