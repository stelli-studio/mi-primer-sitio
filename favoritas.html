
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>favoritas</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body class="pagina-playlist">

<header class="encabezado">
    <button class="boton-menu" onclick="history.back()">←</button>
    <a class="logo" href="index.html"> ♪ STELLI<span>MUSIC</span></a>
    <a href="index.html" class="volver-inicio">Inicio</a>
</header>

<main class="contenido-playlist">

<section class="portada-playlist relajarse-portada">
    <img src="favorita.jpg" alt="Portada Para relajarse">

    <div class="datos-playlist">
        <p class="tipo-playlist"> PERSONAL</p>
        <h1>💗 Favoritas</h1>
        <p class="descripcion-playlist">
            Canciones que nunca me cansare de escuchar.
        </p>
    </div>
</section>

<section class="seccion-canciones">

    <div class="encabezado-canciones">
        <h2>Mi música favorita</h2>
    </div>

    <div class="fila-cancion">
        <span class="numero">01</span>
        <img src="ivann.jpg" alt="J.">

        <div class="info-cancion">
            <h3>J.</h3>
            <p>Iván Cornejo</p>
        </div>

        <audio class="musica">
            <source src="canciones/j.mp3" type="audio/mpeg">
        </audio>
         <button class="boton-play" onclick="playMusic(this)">▶</button>
        <span class="duracion">♫</span>
    </div>

    <div class="fila-cancion">
        <span class="numero">02</span>
        <img src="eslabon.jpg" alt="Amarte a la Antigua">

        <div class="info-cancion">
            <h3>Amarte a la antigua</h3>
            <p>Eslabón Armado</p>
        </div>

        <audio class="musica">
            <source src="canciones/amarte a la antigua.mp3" type="audio/mpeg">
        </audio>
        <button class="boton-play" onclick="playMusic(this)">▶</button>
        <span class="duracion">♫</span>
    </div>

    <div class="fila-cancion">
        <span class="numero">03</span>
        <img src="jasiel.jpg" alt="Cielo Eterno">

        <div class="info-cancion">
            <h3>Cielo Eterno</h3>
            <p>Jasiel Núñez</p>
        </div>

        <audio class="musica">
            <source src="canciones/cielo eterno.mp3" type="audio/mpeg">
        </audio>
        <button class="boton-play" onclick="playMusic(this)">▶</button>
        <span class="duracion">♫</span>
    </div>

</section>
</main>

<script>
function playMusic(boton) {
    let audio = boton.previousElementSibling;

    document.querySelectorAll(".musica").forEach(a => {
        if (a !== audio) {
            a.pause();
            a.currentTime = 0;
            a.nextElementSibling.textContent = "▶";
        }
    });

    if (audio.paused) {
        audio.play();
        boton.textContent = "⏸";
    } else {
        audio.pause();
        boton.textContent = "▶";
    }
}
</script>

</body>
</html>
