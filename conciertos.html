<head>
    <meta charset="utf-8">

	<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="encabezado">
        <button class="boton-menu" id="abrirMenu" aria-label="Abrir menú" aria-expanded="false">☰</button>
        <a class="logo" href="#inicio">♪ STELLI</a>
    </header>
 <div class="fondo-menu" id="fondoMenu"></div>
    <aside class="menu-lateral" id="menuLateral">
        <div class="menu-titulo"><h2>Tu espacio</h2><button id="cerrarMenu" aria-label="Cerrar menú">×</button></div>
        <a class="enlace activo" href="index.html #inicio">⌂ <span>Inicio</span></a>
        <a class="enlace" href="index.html #albumes">▣ <span>Álbumes</span></a>
        <a class="enlace" href="index.html #conciertos">▶ <span>Conciertos</span></a>
        <a class="enlace" href="index.html #listas">☷ <span>Mis listas</span></a>
        <div class="menu-nota"><div class="nota-icono">♫</div><strong>Tu música, tu estilo</strong></div>
    </aside>
<main class="pagina-conciertos">
<h2>🎤 Conciertos en vivo</h2>
     <div class="lista-conciertos">
       <div class="tarjeta-concierto">
            <h3>Iván Cornejo</h3>
            <video controls width="100%"><source src="ivan.mp4" type="video/mp4">
            </video>
        </div>

        <div class="tarjeta-concierto">
            <h3>Jasiel Núñez</h3>
            <video controls width="100%"><source src="jasiel.mp4" type="video/mp4">
            </video>
        </div>

        <div class="tarjeta-concierto">
            <h3>Billie Eilish</h3>
            <video controls width="100%"><source src="billie.mp4" type="video/mp4">
            </video>
        </div>

        <div class="tarjeta-concierto">
            <h3>Paulo Londra</h3>
            <video controls width="100%"><source src="paulo.mp4" type="video/mp4">
            </video>
        </div>

        <div class="tarjeta-concierto">
            <h3>Aitana</h3>
            <video controls width="100%"><source src="aitana.mp4" type="video/mp4">
            </video>
        </div>

    </div>
    </main>
     <script>
        const menu = document.getElementById('menuLateral');
        const fondo = document.getElementById('fondoMenu');
        const abrir = document.getElementById('abrirMenu');
        const cerrar = document.getElementById('cerrarMenu');

        function abrirMenu() {
            menu.classList.add('mostrar');
            fondo.classList.add('mostrar');
            abrir.setAttribute('aria-expanded', 'true');
        }
        function cerrarMenu() {
            menu.classList.remove('mostrar');
            fondo.classList.remove('mostrar');
            abrir.setAttribute('aria-expanded', 'false');
        }
        abrir.addEventListener('click', abrirMenu);
        cerrar.addEventListener('click', cerrarMenu);
        fondo.addEventListener('click', cerrarMenu);
        document.querySelectorAll('.menu-lateral a').forEach(function(enlace) {
            enlace.addEventListener('click', cerrarMenu);
        });
    </script>
</body>
</html>
